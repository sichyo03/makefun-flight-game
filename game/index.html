<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Courier — Golden Hour Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2e4a73; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sky Courier: fly a courier aeroplane over a golden-hour coast. Arrow keys pitch and bank, W and S work the throttle, F toggles flaps, Space drops cargo."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#fff;font-family:sans-serif;padding:2em">Sky Courier needs JavaScript to fly. Enable it and reload.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
